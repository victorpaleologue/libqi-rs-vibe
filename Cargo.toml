[workspace]
members = [
  "qi",
  "qi-macros",
  "tests-macros",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Victor Paleologue <victor.paleologue@palaio.eu>", "Vincent Palancher"]
version = "0.1.0"
license = "BSD-3-Clause"
rust-version = "1.90"
repository = "https://github.com/victorpaleologue/libqi-rs-vibe"
homepage = "https://github.com/victorpaleologue/libqi-rs-vibe"
keywords = ["naoqi", "libqi", "robotics", "rpc", "pepper"]
categories = ["network-programming", "science::robotics"]

[workspace.dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
anyhow = "1.0.100"
assert_matches = "1.5.0"
async-stream = "0.3.6"
async-trait = "0.1.89"
bytes = { version = "1.11.0", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
derive_more = { version = "2.0.1", features = [
  "display",
  "from",
  "into",
  "index",
  "into_iterator",
] }
dirs = "6.0.0"
either = "1.15.0"
futures = "0.3.31"
once_cell = "1.21.3"
ordered-float = { version = "5.1.0", features = ["serde"] }
pin-project-lite = "0.2.16"
pretty_assertions = "1.4.1"
sealed = "0.6.0"
seq-macro = "0.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde-value = "0.7.0"
serde_json = "1.0.145"
serde_with = "3.16.1"
serde_test = "1.0.177"
sha1_smol = "1.0.1"
syn = { version = "2.0.111", features = ["full", "extra-traits"] }
sysinfo = "0.37.2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "time", "net", "macros"] }
tokio-test = "0.4.4"
tokio-util = { version = "0.7.17", features = ["codec"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "v5"] }
