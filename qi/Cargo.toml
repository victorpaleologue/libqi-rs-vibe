[package]
name = "libqi-vibe"
description = "The qi framework of NAOqi robots (libqi, qimessaging) in Rust: sessions, services, objects, signals and properties, byte-compatible with the C++ implementation"

edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
rust-version.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# The package is `libqi-vibe` on crates.io; the library is used as `qi`.
name = "qi"

[features]
default = ["machine-uid"]
# Derive the machine identifier from the operating system's machine id, like libqi.
machine-uid = ["dep:machine-uid"]
# The `qi-cli` command: inspect and drive the services of a space.
cli = [
  "dep:anyhow",
  "dep:base64",
  "dep:clap",
  "dep:colored",
  "dep:rpassword",
  "dep:serde_json",
  "dep:tracing-subscriber",
  "tracing-subscriber/env-filter",
  "tokio/rt-multi-thread",
  "tokio/signal",
  "tokio/time",
]
# The `qi::naoqi_sim` module and the `naoqi-sim` command: a simulated NAO or Pepper robot.
naoqi-sim = [
  "dep:anyhow",
  "dep:clap",
  "dep:serde_json",
  "dep:tracing-subscriber",
  "tokio/rt-multi-thread",
  "tokio/sync",
  "tokio/signal",
  "tokio/fs",
  "tokio/io-util",
  "tokio/io-std",
]
# Modules: shared libraries exporting functions and object factories (`#[qi::module]`), loaded
# by `libqi` hosts, NAOqi and `qi-launch`.
module = [
  "dep:cc",
  "dep:libc",
  "dep:libloading",
  "dep:tracing-subscriber",
  "tracing-subscriber/env-filter",
  "tokio/rt-multi-thread",
  "tokio/sync",
  "tokio/time",
]
# The `libqi` entry points of modules (`qi_module_init`, and the factories of `libqi` 2.1), built
# against the libqi SDK named by the `QI_MODULE_CPP_SDK` environment variable.
module-cpp = ["module", "dep:cc"]
# The DCM plugins of modules (`#[qi::dcm]`): their `ALModule` in NAOqi, built against the C++ SDK
# of NAOqi named by the `QI_MODULE_NAOQI_SDK` environment variable.
module-naoqi = ["module", "dep:cc"]
# The `qi-launch` command: the counterpart of `qilaunch`, loading modules as services.
launch = [
  "module",
  "dep:anyhow",
  "dep:base64",
  "dep:clap",
  "dep:serde_json",
  "tokio/signal",
]

[dependencies]
qi-macros = { package = "libqi-macros-vibe", path = "../qi-macros", version = "1.0.0" }
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
dirs = { workspace = true }
either = { workspace = true }
futures = { workspace = true }
machine-uid = { version = "0.5.4", optional = true }
once_cell = { workspace = true }
ordered-float = { workspace = true }
libc = { version = "0.2.177", optional = true }
libloading = { version = "0.8.9", optional = true }
ouroboros = "0.18.5"
pin-project-lite = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
sealed = { workspace = true }
seq-macro = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
sha1_smol = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
# Command-line tools (features `cli` and `naoqi-sim`).
anyhow = { workspace = true, optional = true }
base64 = { version = "0.23.1", optional = true }
clap = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
# The masked prompt of qi-cli's authentication token.
rpassword = { version = "7.5", optional = true }
serde_json = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[build-dependencies]
cc = { version = "1.2.41", optional = true }

[dev-dependencies]
anyhow = { workspace = true }
libloading = "0.8.9"
assert_matches = { workspace = true }
clap = { workspace = true }
pretty_assertions = { workspace = true }
serde-value = { workspace = true }
serde_json = { workspace = true }
serde_test = { workspace = true }
serde_with = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "signal"] }
tokio-test = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "qi-cli"
path = "src/bin/qi-cli/main.rs"
required-features = ["cli"]

[[bin]]
name = "naoqi-sim"
path = "src/bin/naoqi-sim.rs"
required-features = ["naoqi-sim"]

[[bin]]
name = "qi-launch"
path = "src/bin/qi-launch/main.rs"
required-features = ["launch"]

[[test]]
name = "module"
required-features = ["launch"]

[[test]]
name = "module_autoload"
required-features = ["module"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "naoqi_sim"
path = "tests/naoqi_sim/main.rs"
required-features = ["naoqi-sim"]
